<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farol Interno · 40 dias</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#04070b;--ink:#eef1f5;--mute:#98a3b3;--lamp:#ffb627;--warn:#e5484d;--line:#243040;--card:#0d141d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 Manrope,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
#glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 45% at 50% 0,rgba(255,182,39,.5),transparent 70%);opacity:.05;transition:opacity 1.2s}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:0;background:var(--lamp);transition:width .5s;z-index:5}
main{position:relative;max-width:560px;margin:0 auto;padding:44px 22px 60px}
h1,h2{font-family:'Barlow Condensed',sans-serif;font-weight:800;line-height:.98;margin:0 0 18px;letter-spacing:.01em;text-transform:uppercase}
h1{font-size:clamp(46px,13vw,72px)}h2{font-size:clamp(34px,9.5vw,48px)}
p{margin:0 0 16px}.m{color:var(--mute)}.w{color:var(--warn)}.l{color:var(--lamp)}b{font-weight:800}
.logo{display:block;width:min(260px,62%);margin:0 auto 14px}
.beam{height:90px;margin:-4px -22px 14px;background:linear-gradient(100deg,transparent 20%,rgba(255,182,39,.28) 50%,transparent 80%);background-size:200% 100%;animation:sw 5s ease-in-out infinite alternate}
@keyframes sw{from{background-position:100% 0}to{background-position:0 0}}
.btn{display:block;width:100%;margin-top:26px;padding:19px 16px;border:0;border-radius:10px;background:var(--lamp);color:#1a1100;font:800 18px Manrope,sans-serif;cursor:pointer;text-align:center;text-decoration:none}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #fff;outline-offset:3px}
.opt{display:block;width:100%;text-align:left;margin:0 0 10px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:600 16px Manrope,sans-serif;cursor:pointer}
.opt:hover,.opt.on{border-color:var(--lamp)}
.nao{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.nao span:last-child{color:var(--warn);font-weight:800;white-space:nowrap}
.box{background:var(--card);border-left:4px solid var(--lamp);padding:16px 18px;margin:0 0 14px;border-radius:0 10px 10px 0}
.box.r{border-color:var(--warn)}.box h3{margin:0 0 4px;font-size:17px}.box p{margin:0;color:var(--mute);font-size:15px}
.bn{transition:opacity .6s,filter .6s}.bn.lock{opacity:.25;filter:blur(5px)}
.price{font:800 64px/1 'Barlow Condensed',sans-serif;color:var(--lamp);margin:6px 0}
ul.ck{list-style:none;padding:0;margin:0 0 18px}ul.ck li{padding:7px 0 7px 28px;position:relative}ul.ck li::before{content:"✓";position:absolute;left:0;color:var(--lamp);font-weight:800}
small{display:block;color:var(--mute);font-size:13px;line-height:1.5;margin-top:26px}
.scr{animation:in .45s}@keyframes in{from{opacity:0}to{opacity:1}}details{border-bottom:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-weight:800}details p{margin:10px 0 0;color:var(--mute);font-size:15px}.fx p{margin:0 0 4px}.fx{margin-bottom:20px}
@media(prefers-reduced-motion:reduce){.beam,.scr{animation:none}*{transition:none!important}}
</style></head><body>

{html:()=>`<h2>Ninguém fez isso com você.</h2><p>Existe um sistema inteiro desenhado para ocupar a sua mente: rolagem infinita, apostas a um toque, recompensa rápida. Ele oferece a distração.</p><p><b class="l">Mas é você quem aperta o botão, todos os dias.</b></p><p>E isso é uma boa notícia: se você escolheu a armadilha todos os dias, pode escolher outra coisa todos os dias. O problema nunca foi falta de caminho. É a neblina que impede você de ver a própria luz.</p>${btn("Eu quero sair da neblina",6)}`},
{html:()=>`<h2>A saída existe. Ela cobra um preço.</h2><p>Não é dinheiro, sorte ou talento. É <b class="l">renúncia</b>:</p><div class="box r"><h3>Dos vícios</h3><p>que te aliviam por minutos e te custam anos.</p></div><div class="box r"><h3>Das pessoas e lugares</h3><p>que te puxam de volta toda vez que você tenta subir.</p></div><div class="box r"><h3>Das desculpas</h3><p>que você conta há tanto tempo que passou a acreditar.</p></div><p style="margin-top:22px"><b>Este programa não é para quem quer consolo.</b> Se você prefere culpar a tempestade, feche esta página agora.</p>${btn("Eu aceito o desafio de 40 dias",7)}`},

{html:()=>`<h2>40 dias. 5 etapas.</h2><div class="box"><h3>A Neblina · Dia 0</h3><p>Diagnóstico, nota inicial e contrato.</p></div><div class="box r"><h3>O Fogo · Dias 1 a 10</h3><p>Ruptura: redes, pornografia, apostas, álcool, cigarro, drogas, comida, compras, jogos e trabalho excessivo. Com protocolo de recaída.</p></div><div class="box"><h3>A Forja · Dias 11 a 22</h3><p>Rotina, alimentação, treino, sono e família.</p></div><div class="box"><h3>O Arsenal Mental · Dias 23 a 34</h3><p>Mente antifrágil, fim do vitimismo, leitura de poder e pensamentos que sabotam.</p></div><div class="box"><h3>O Farol · Dias 35 a 40</h3><p>Reavaliação com o seu número do Dia 0 e código pessoal.</p></div><p class="m">Sem promessa milagrosa: 40 dias não resolvem a vida inteira. Devolvem a direção e a confiança na sua própria palavra.</p>${btn("Eu quero o guia",9)}`},
